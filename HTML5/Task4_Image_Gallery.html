<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <style>
        .gallery-img {
            width: 200px;
            height: 150px;
            border: 3px solid black;
            padding: 5px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Community Events Gallery</h1>

    <table border="1">

        <tr>
            <td>
                <img src="event1.jpg"
                     alt="Events"
                     title="Event Festivals 2026"
                     class="gallery-img">
                <p>Event Festivals 2026</p>
            </td>

            <td>
                <img src="event2.jpg"
                     alt="Event Hall"
                     title="Event Hall"
                     class="gallery-img">
                <p>Event Hall</p>
            </td>

            <td>
                <img src="event3.jpg"
                     alt="Event Organization"
                     title="How events are organized"
                     class="gallery-img">
                <p>How events are organized</p>
            </td>
        </tr>

       
    </table>

</body>
</html>
