<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 10px;
        }

        input, select, textarea {
            width: 300px;
            padding: 5px;
        }

        input[type="submit"] {
            width: auto;
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Event Registration Form</h1>

    <form onsubmit="showMessage(); return false;">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>

        <label for="event">Event Type:</label>
        <select id="event" name="event" required>
            <option value="">-- Select Event --</option>
            <option value="music">Music Festival</option>
            <option value="sports">Sports Event</option>
            <option value="art">Art Exhibition</option>
        </select>
        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" placeholder="Any additional information..."></textarea>
        <br><br>

        <input type="submit" value="Register">

    </form>

    <p id="confirmation"></p>

    <script>
        function showMessage() {
            document.getElementById("confirmation").innerHTML =
                "Registration successful!";
        }
    </script>

</body>
</html>
