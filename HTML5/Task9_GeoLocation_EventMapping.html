<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation for Event Mapping</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: linear-gradient(135deg, #f5f7ff, #eef8ff);
            color: #20324a;
        }
        .card {
            max-width: 780px;
            margin: auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            padding: 24px;
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { background: #1d4ed8; }
        #result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            line-height: 1.5;
        }
        .event-list { margin-top: 18px; display: grid; gap: 10px; }
        .event-item {
            border: 1px solid #dbe4f0;
            border-radius: 10px;
            padding: 10px 12px;
            background: #fafcff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Find Nearby Events</h1>
        <p>Use your current location to locate the nearest event venue.</p>
        <button id="findNearbyBtn" type="button">Find Nearby Events</button>

        <div id="result">Click the button to detect your location and compare it with available events.</div>

        <div class="event-list" id="eventList"></div>
    </div>

    <script>
        const eventLocations = [
            { name: 'Tech Meetup Hub', latitude: 18.5204, longitude: 73.8567 },
            { name: 'City Music Fest', latitude: 18.5314, longitude: 73.8445 },
            { name: 'Creative Design Expo', latitude: 18.5088, longitude: 73.8298 }
        ];

        const resultBox = document.getElementById('result');
        const eventList = document.getElementById('eventList');

        document.getElementById('findNearbyBtn').addEventListener('click', getLocation);

        function getLocation() {
            if (!navigator.geolocation) {
                resultBox.innerHTML = 'Geolocation is not supported by this browser.';
                return;
            }

            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            resultBox.innerHTML = 'Fetching your precise location...';
            navigator.geolocation.getCurrentPosition(showPosition, showError, options);
        }

        function showPosition(position) {
            const lat = position.coords.latitude.toFixed(4);
            const lon = position.coords.longitude.toFixed(4);
            const accuracy = position.coords.accuracy.toFixed(0);
            const nearest = findNearestEvent(lat, lon);

            resultBox.innerHTML = `Your coordinates: Latitude ${lat}, Longitude ${lon}<br>` +
                `Accuracy: ±${accuracy} meters<br>` +
                `Nearest event: ${nearest.name} (${nearest.distanceKm.toFixed(2)} km away)`;

            renderEvents(lat, lon);
        }

        function showError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    resultBox.innerHTML = 'Permission denied. Please allow location access to find nearby events.';
                    break;
                case error.POSITION_UNAVAILABLE:
                    resultBox.innerHTML = 'Location information is unavailable right now.';
                    break;
                case error.TIMEOUT:
                    resultBox.innerHTML = 'The request to get your location timed out. Please try again.';
                    break;
                default:
                    resultBox.innerHTML = 'An unknown geolocation error occurred.';
            }
        }

        function findNearestEvent(userLat, userLon) {
            return eventLocations
                .map(event => ({
                    ...event,
                    distanceKm: calculateDistance(userLat, userLon, event.latitude, event.longitude)
                }))
                .sort((a, b) => a.distanceKm - b.distanceKm)[0];
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const toRad = value => (value * Math.PI) / 180;
            const R = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function renderEvents(userLat, userLon) {
            eventList.innerHTML = eventLocations
                .map(event => {
                    const distance = calculateDistance(userLat, userLon, event.latitude, event.longitude).toFixed(2);
                    return `<div class="event-item"><strong>${event.name}</strong><br>Distance: ${distance} km</div>`;
                })
                .join('');
        }
    </script>
</body>
</html>
