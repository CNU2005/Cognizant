<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Invite with Media Events</title>

    <script>

        function videoReady() {
            document.getElementById("msg").innerHTML =
                "Video ready to play";
        }

        window.onbeforeunload = function () {
            return "You have unfinished changes. Are you sure you want to leave?";
        };

    </script>
</head>

<body>

    <h1>Event Promo Video</h1>

    <video width="500"
           controls
           oncanplay="videoReady()">

        <source src="6396120-hd_1080_1920_25fps.mp4" type="video/mp4">

        Your browser does not support the video tag.

    </video>

    <p id="msg"></p>

</body>
</html>
