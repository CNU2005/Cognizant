<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
</head>
<body>

    <h2>Register for an Event</h2>

    <form id="registrationForm">
        <input
            type="text"
            id="name"
            placeholder="Enter Name"
            required
        >
        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
        >
        <br><br>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <script src="Ex12.js"></script>

</body>
</html>
