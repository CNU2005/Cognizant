<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging with chrome Dev Tools</title>
</head>
<body>
    <h1>Debugging with Chrome Dev Tools</h1>
    <p>Open the console to see the debug messages.</p>
    <button onclick="debugFunction()">Click to Debug</button>
    <script>
        function debugFunction() {
            console.log("Debugging function called.");
            let x = 10;
            let y = 20;
            let sum = x + y;
            console.log("The sum of x and y is: " + sum);
        }
    </script>
</body>
</html>
